<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        h2 {
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #e8eaf6;
            text-align: center;
        }
        fieldset {
            border: 1px solid #888;
            padding: 20px;
        }
        legend {
            padding: 0 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
        }
        button {
            padding: 6px 16px;
            cursor: pointer;
        }
        footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <p class="subtitle">Available Courses</p>
            <table>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="submit.php" method="POST">
                <fieldset>
                    <legend>Application Form</legend>
                    
                    <div class="form-group">
                        <label for="app-name">Name:</label>
                        <input type="text" id="app-name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="app-email">Email:</label>
                        <input type="email" id="app-email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="app-course">Course:</label>
                        <select id="app-course" name="course">
                            <option value="btech-cse">B.Tech CSE</option>
                            <option value="bca">BCA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="statement">Statement:</label>
                        <textarea id="statement" name="statement"></textarea>
                    </div>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>

</body>
</html>
