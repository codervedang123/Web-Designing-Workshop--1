<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 12: Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 300px;
        }
        caption {
            caption-side: top;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: left;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <caption>Student Marks</caption>
        <thead>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
