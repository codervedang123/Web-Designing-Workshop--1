<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 13: Timetable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            text-align: center;
        }
        caption {
            caption-side: top;
            font-weight: bold;
            margin-bottom: 8px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Weekly Timetable</caption>
        <thead>
            <tr>
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mon</td>
                <td>Maths</td>
                <td>HTML</td>
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr>
                <td>Tue</td>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
            <tr>
                <td>Wed</td>
                <td colspan="3">Seminar</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
