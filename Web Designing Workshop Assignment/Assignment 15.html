<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 15: Form Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            margin: auto;
        }
        fieldset {
            width: 450px;
            border: 1px solid #444;
            padding: 15px;
        }
        legend {
            padding: 0 5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            width: 90px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 300px;
            padding: 4px;
        }
    </style>
</head>
<body>

    <form>
        <fieldset>
            <legend>Personal Details</legend>
            
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male" style="width:auto; margin-right:15px;">Male</label>
                
                <input type="radio" id="female" name="gender" value="female">
                <label for="female" style="width:auto;">Female</label>
            </div>

            <div class="form-group">
                <label>Hobbies:</label>
                <input type="checkbox" id="reading" name="hobbies" value="reading">
                <label for="reading" style="width:auto; margin-right:15px;">Reading</label>
                
                <input type="checkbox" id="coding" name="hobbies" value="coding">
                <label for="coding" style="width:auto;">Coding</label>
            </div>

            <div class="form-group">
                <label for="dob">DOB:</label>
                <input type="date" id="dob" name="dob">
            </div>

        </fieldset>
    </form>

</body>
</html>
