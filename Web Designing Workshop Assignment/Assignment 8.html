<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body id="top">

    <p>Links demo</p>

    <p><a href="https://www.example.com" target="_blank">External link</a></p>

    <p><a href="#bottom">Jump to bottom</a></p>

    <p><a href="mailto:example@email.com">Email us</a></p>

    <div style="border: 1px solid #ccc; display: inline-block; padding: 10px;">

        <a href="https://www.example.com">

            <img src="logo.png" alt="Logo" width="50" height="50">

        </a>

    </div>

    <div style="margin-top: 350px;" id="bottom">

        Bottom. <a href="#top">Back to top</a>

    </div>

    </div>
