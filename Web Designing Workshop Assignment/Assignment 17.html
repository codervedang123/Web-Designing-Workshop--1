<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17: Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        input {
            width: 250px;
            padding: 5px;
        }
        button {
            padding: 6px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form action="submit.php" method="POST">
        <div class="form-group">
            <input type="text" name="fullname" placeholder="Full name" required>
        </div>

        <div class="form-group">
            <input type="email" name="email" placeholder="you@college.edu" required>
        </div>

        <div class="form-group">
            <input type="text" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
        </div>

        <div class="form-group">
            <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
            <input type="number" name="age" placeholder="Age (17)" max="30" required>
        </div>

        <button type="submit">Register</button>
    </form>

</body>
</html>
