<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 14: Nested and Responsive Tables</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 400px;
            min-width: 600px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        .nested-table {
            width: 100%;
            margin: 0;
        }
        .nested-table th, .nested-table td {
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Lab Batches</th>
                    <th>Faculty</th>
                    <th>Room</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Friday</td>
                    <td>
                        <table class="nested-table">
                            <thead>
                                <tr>
                                    <th>Batch</th>
                                    <th>System</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>A1</td>
                                    <td>PC 1-20</td>
                                </tr>
                                <tr>
                                    <td>A2</td>
                                    <td>PC 21-40</td>
                                </tr>
                            </tbody>
                        </table>
                    </td>
                    <td>Dr. Sharma</td>
                    <td>Lab 2</td>
                    <td>2-4 PM</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
